name: Build & Release

# One v* tag ships both stores: Android builds a signed APK + AAB and attaches
# the APK to a GitHub Release; iOS builds a signed .ipa and uploads it to
# TestFlight. Nothing goes to Google Play from here yet: the Kotlin app in
# Nicsilver/LGPower still owns the Play listing for com.nic.lgpower.
#
# macOS runners are free and unmetered because the repo is public; keep it
# public or the ios job starts costing 10x Linux minutes.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      # The protocol tests talk to the fake webOS TV, which only runs locally.
      - run: flutter test --exclude-tags faketv

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK 17
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/upload-keystore.jks

      - name: Write signing config
        run: |
          cat > android/key.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      - name: Build release APK + AAB
        run: |
          flutter build apk --release
          flutter build appbundle --release

      - name: Name the artifact
        run: cp build/app/outputs/flutter-apk/app-release.apk lgpower-${{ github.ref_name }}.apk

      # Only when a tag is pushed; workflow_dispatch just builds (a signing smoke-test).
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: lgpower-${{ github.ref_name }}.apk
          generate_release_notes: true

  ios:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      # The Apple Distribution certificate goes into a throwaway keychain on the runner.
      - name: Import distribution certificate
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      # Fetched fresh from Apple every build, so a regenerated profile (after an
      # App ID capability change) needs no secret update here.
      - name: Download provisioning profile
        uses: apple-actions/download-provisioning-profiles@2126b5f86a0e2863cbf4d2d312112b22b943a594 # v6
        with:
          bundle-id: com.nic.lgpower
          profile-type: IOS_APP_STORE
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}

      - name: Build signed ipa
        run: |
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          echo "IPA=$(ls build/ios/ipa/*.ipa)" >> "$GITHUB_ENV"

      - name: Keep the ipa as a run artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lgpower-${{ github.ref_name }}-ios
          path: build/ios/ipa/*.ipa

      # Only when a tag is pushed: Apple refuses a build number it has seen before,
      # so a dispatch run must not consume one.
      - name: Upload to TestFlight
        if: startsWith(github.ref, 'refs/tags/')
        uses: apple-actions/upload-testflight-build@5e75ff58276689011512ba87a381d93dc67dbcf8 # v5.3.0
        with:
          app-path: ${{ env.IPA }}
          issuer-id: ${{ vars.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ vars.APPSTORE_API_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
