# iOS release pipeline (Codemagic free tier, mac_mini_m2), copied from Ordrejsen.
# Auth: the "codemagic-ci" App Store Connect integration; signing is automatic
# via ios_signing + use-profiles. Triggers on v* tags or manually from the UI.
workflows:
  ios-release:
    name: iOS release
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic-ci
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.nic.lgpower
      flutter: stable
      xcode: latest
    triggering:
      events:
        - tag
      tag_patterns:
        - pattern: "v*"
          include: true
    scripts:
      - name: Fetch dependencies
        script: flutter pub get
      - name: Run tests
        script: flutter test
      - name: Apply signing profiles
        script: xcode-project use-profiles
      - name: Build signed ipa
        script: |
          flutter build ipa --release \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
